name: Build MOSSLYA KIDS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Flutter project ZIP not found"
            exit 1
          fi

          mkdir -p flutter_source
          unzip -q "$ZIP_FILE" -d flutter_source

      - name: Find Flutter project
        run: |
          PUBSPEC=$(find flutter_source -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          echo "SOURCE_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable

      - name: Create fresh Flutter Android project
        run: |
          flutter create --platforms=android mosslya_build

      - name: Copy MOSSLYA KIDS app files
        run: |
          cp -r "$SOURCE_DIR/lib" mosslya_build/
          
          if [ -d "$SOURCE_DIR/assets" ]; then
            cp -r "$SOURCE_DIR/assets" mosslya_build/
          fi
          
          cp "$SOURCE_DIR/pubspec.yaml" mosslya_build/pubspec.yaml

      - name: Install dependencies
        working-directory: mosslya_build
        run: flutter pub get

      - name: Build APK
        working-directory: mosslya_build
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mosslya-kids-apk
          path: mosslya_build/build/app/outputs/flutter-apk/app-debug.apk
